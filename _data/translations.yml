en:
  app_information: App information
  app_tagline: Walks, stories and city details
  app_description: Discover Saint Petersburg with short walks, stories, photos, video and audio guides. Create routes of your own, add favourite places and share your walks with friends.
  features:
    - title: Choose your route
      description: Find a walk by theme and duration.
    - title: Explore every stop
      description: Discover stories through photos, video and audio.
    - title: Create your own walks
      description: Build a route with your own stops, photos, video and audio, and keep private notes along the way.
    - title: Share with friends
      description: Share your routes with friends so they can discover the same places.
  capabilities_link: Explore features
  capabilities_title: More than a list of places
  capabilities_intro: Plan a walk, discover the stories behind each stop and collect routes you want to return to. Video Vibe brings the route, its media and your own observations together.
  capabilities:
    - title: Find a walk that fits your day
      points:
        - Search by route name, filter by theme or choose a walk of up to 45 minutes.
        - Check the estimated duration, stop list and route description before you start.
        - Set a reminder for a walk at a time you choose.
    - title: Follow the route at your own pace
      points:
        - Open stops from the list or map, and use your current location to orient yourself.
        - Read stories, view photographs and short videos, and listen to audio guides with playback controls.
        - Mark places as visited, keep track of your progress and write private notes for individual stops.
    - title: Create a walk and pass it on
      points:
        - Build a route with a title, description, theme, duration and an ordered list of stops.
        - Add place coordinates and attach your own photographs, video and audio.
        - Reopen your routes from the library and continue editing them.
        - Share catalogue routes with a link that opens in Video Vibe, or transfer a personal route to a friend’s device.
      note: Personal routes are transferred between devices on the same local network, using a pairing code and confirmation from the sender. Both people need Video Vibe; the transfer also requires an internet connection.
    - title: Keep your walks in one place
      points:
        - Find saved, started, completed, created and downloaded routes in your personal library.
        - Download a route’s text and media in advance, and manage downloaded materials in your profile.
        - Sign in with a password, then enable Face ID or Touch ID on a supported device after a successful sign-in.
        - Use the interface in English or Russian.
      note: The map requires an internet connection.
  getting_started_title: Your next walk in three steps
  getting_started:
    - title: Choose or create
      description: Pick a ready-made route or put together your own places and stories.
    - title: Explore the stops
      description: Open places on the map, listen to stories and mark the stops you visit.
    - title: Keep and share
      description: Save the route, leave personal notes and share the walk with friends.
  route_example:
    label: Route example
    city: Saint Petersburg
    title: Morning by the Water
    metadata: 45 min · 4 stops
    description: From Senate Square to the Winter Palace, along the Neva and its granite embankments.
    image_alt: The Bronze Horseman monument against a blue sky beside the Neva.
    stops_label: Stops on this route
    stops:
      - The Bronze Horseman
      - Admiralty Embankment
      - Palace Bridge
      - The Winter Palace from the Neva
    photo_credit: "Photo: Alex (Florstein) Fedorov"
    photo_source: Wikimedia Commons
    photo_changes: Cropped for display.
  documents: Documents & support
  intro: Privacy, terms and support information for the Video Vibe app.
