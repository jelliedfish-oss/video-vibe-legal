  home_label: Video Vibe home
  navigation: Main navigation
  language: Language
  status: Coming soon
  placeholder: Information will appear here soon.
  back: Back to app information
  sections:
    privacy:
      title: Privacy Policy
    terms:
      title: Terms of Use
    help:
      title: Help & Support
ru:
  app_information: Информация о приложении
  app_tagline: Прогулки, истории и детали города
  app_description: Открывайте Санкт-Петербург через короткие прогулки, истории, фото, видео и аудиогиды. Создавайте собственные маршруты, добавляйте любимые места и делитесь прогулками с друзьями.
  features:
    - title: Выберите прогулку
      description: Подбирайте маршрут по теме и времени.
    - title: Узнавайте город
      description: Истории мест — в фотографиях, видео и аудиогидах.
    - title: Создавайте свои прогулки
      description: Собирайте маршрут из своих остановок, фото, видео и аудио и сохраняйте личные заметки по пути.
    - title: Делитесь с друзьями
      description: Делитесь своими маршрутами с друзьями, чтобы они тоже могли открыть эти места.
  capabilities_link: Возможности
  capabilities_title: Больше, чем список мест
  capabilities_intro: Планируйте прогулку, узнавайте истории каждой остановки и собирайте маршруты, к которым захочется вернуться. В Video Vibe маршрут, медиаматериалы и ваши впечатления находятся рядом.
  capabilities:
    - title: Найдите прогулку под свои планы
      points:
        - Ищите маршруты по названию, выбирайте тему или прогулку продолжительностью до 45 минут.
        - Перед началом посмотрите примерное время прогулки, список остановок и описание маршрута.
        - Настройте напоминание о прогулке на удобное время.
    - title: Проходите маршрут в своём темпе
      points:
        - Открывайте остановки из списка или на карте и ориентируйтесь по своей текущей геопозиции.
        - Читайте истории, смотрите фотографии и короткие видео, слушайте аудиогиды с управлением воспроизведением.
        - Отмечайте посещённые места, сохраняйте прогресс прогулки и оставляйте личные заметки к отдельным остановкам.
    - title: Создайте прогулку и поделитесь ею
      points:
        - Задайте название, описание, тему и длительность маршрута, соберите остановки в нужном порядке.
        - Укажите координаты мест и добавьте собственные фотографии, видео и аудио.
        - Возвращайтесь к своим маршрутам из библиотеки и продолжайте редактирование.
        - Отправляйте ссылки на маршруты каталога, которые открываются в Video Vibe, или передавайте личный маршрут на устройство друга.
      note: Личные маршруты передаются между устройствами в одной локальной сети по коду сопряжения и с подтверждением отправителя. У обоих участников должен быть Video Vibe; для передачи также нужен интернет.
    - title: Храните свои прогулки в одном месте
      points:
        - В личной библиотеке собраны избранные, начатые, завершённые, созданные и скачанные маршруты.
        - Заранее скачивайте текст и медиа маршрута, а затем управляйте загрузками в профиле.
        - Входите по паролю, а после успешной авторизации включите Face ID или Touch ID на поддерживаемом устройстве.
        - Пользуйтесь интерфейсом на русском или английском языке.
      note: Для отображения карты нужен интернет.
  getting_started_title: Следующая прогулка — в три шага
  getting_started:
    - title: Выберите или создайте
      description: Найдите готовый маршрут или соберите собственные места и истории.
    - title: Исследуйте остановки
      description: Открывайте места на карте, слушайте истории и отмечайте посещённые точки.
    - title: Сохраните и поделитесь
      description: Добавьте маршрут в библиотеку, оставьте личные заметки и поделитесь прогулкой с друзьями.
  route_example:
    label: Пример маршрута
    city: Санкт-Петербург
    title: Утро у воды
    metadata: 45 мин · 4 остановки
    description: От Сенатской площади к Зимнему дворцу, вдоль Невы и гранитных набережных.
    image_alt: Памятник «Медный всадник» на фоне голубого неба у Невы.
    stops_label: Остановки на маршруте
    stops:
      - Медный всадник
      - Адмиралтейская набережная
      - Дворцовый мост
      - Зимний дворец со стороны Невы
    photo_credit: "Фото: Alex (Florstein) Fedorov"
    photo_source: Wikimedia Commons
    photo_changes: Кадрирование при отображении.
