ru:
  app_information: Информация о приложении
  app_tagline: Прогулки, истории и детали города
  app_description: Открывайте Санкт-Петербург через короткие прогулки, истории, фото, видео и аудиогиды. Создавайте собственные маршруты, добавляйте любимые места и делитесь прогулками с друзьями.
  features:
    - title: Выберите прогулку
      description: Подбирайте маршрут по теме и времени.
    - title: Узнавайте город
      description: Истории мест — в фотографиях, видео и аудиогидах.
    - title: Создавайте свои прогулки
      description: Собирайте маршрут из своих остановок, фото, видео и аудио и сохраняйте личные заметки по пути.
    - title: Делитесь с друзьями
      description: Делитесь своими маршрутами с друзьями, чтобы они тоже могли открыть эти места.
  route_example:
    label: Пример маршрута
    city: Санкт-Петербург
    title: Утро у воды
    metadata: 45 мин · 4 остановки
    description: От Сенатской площади к Зимнему дворцу, вдоль Невы и гранитных набережных.
    image_alt: Памятник «Медный всадник» на фоне голубого неба у Невы.
    stops_label: Остановки на маршруте
    stops:
      - Медный всадник
      - Адмиралтейская набережная
      - Дворцовый мост
      - Зимний дворец со стороны Невы
    photo_credit: "Фото: Alex (Florstein) Fedorov"
    photo_source: Wikimedia Commons
    photo_changes: Кадрирование при отображении.
