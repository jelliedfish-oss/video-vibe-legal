<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{% if page.home %}{{ site.title | escape }}{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.policy_status == 'pending' %}<meta name="robots" content="noindex, follow">{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Video Vibe home">
        <span class="brand-icon" aria-hidden="true">V</span>
        <span>Video Vibe</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy Policy</a>
      </nav>
    </header>
    <main id="content" class="site-main wrap{% unless page.home %} document{% endunless %}" tabindex="-1">
      {% if page.policy_status == 'pending' %}
      <aside class="notice" aria-label="Publication status">
        <strong>Content coming soon</strong>
        <p>The privacy policy text has not yet been published.</p>
      </aside>
      {% endif %}
      {{ content }}
    </main>
    <footer class="site-footer wrap">
      <span>Video Vibe</span>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    </footer>
  </body>
</html>
